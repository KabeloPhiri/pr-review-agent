# Bundled defaults. A reviewed repo overrides any of these in
# .prreview/config.yaml; the app overrides them with PRREVIEW_* env vars.

scm: azure_devops
quality: noop
reviewer: llm
# Left empty on purpose: every *.md in app/defaults/standards/ is used.
# Set an explicit list here or in a repo's .prreview/config.yaml to narrow it.
analyzers: []

model_endpoint: databricks-claude-sonnet-5-5
temperature: 0.0
max_chunk_chars: 12000

max_files: 60
max_findings_per_file: 10
max_diff_bytes: 400000
sync_wait_seconds: 90.0
exclude_paths:
  - "**/*.ipynb"
  - "**/migrations/**"
  - "**/node_modules/**"
  - "**/*.lock"
  - "**/*.min.js"

standards:
  - .prreview/standards.md
  - .prreview/naming.md
config_path: .prreview/config.yaml

severity_gate: error
post_comments: true
post_status: true
status_genre: pr-review-agent
status_name: ai-code-review

# Opt-in: a repo turns both of these on to let the PR author's "/apply"
# reply push the bot's suggestion as a commit. See README "Accepting a
# suggestion". For /apply these are read from the PR's *target* branch, so
# the opt-in has to be merged before a pull request can use it.
allow_apply_fixes: false
applier: noop
# Only comments written by one of these logins can be applied — the identity
# pr-review.yml posts as. GITHUB_TOKEN posts as github-actions[bot].
apply_trusted_authors: ["github-actions[bot]"]
