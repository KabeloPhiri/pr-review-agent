bundle:
  name: pr_review_agent

resources:
  # Storage for settings changed in the admin console (app/core/settings_store.py).
  # In the dev target, bundle development mode prefixes the schema name.
  schemas:
    pr_review:
      catalog_name: main
      name: pr_review
      comment: "PR review agent: admin console settings"

  volumes:
    console:
      catalog_name: main
      schema_name: ${resources.schemas.pr_review.name}
      name: console
      volume_type: MANAGED
      comment: "Admin console settings, standards, prompts and their history"

  apps:
    pr_review_agent:
      name: "pr-review-agent"
      description: "AI pull request reviewer for Azure DevOps"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-server"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "ai_reviewer_experiment"
          - name: LOG_LEVEL
            value: "INFO"

          # Any field of app/defaults/config.yaml can be overridden here with
          # PRREVIEW_<FIELD>. A reviewed repo's .prreview/config.yaml still
          # wins over these.
          - name: PRREVIEW_SCM
            value: "github"
          - name: PRREVIEW_MODEL_ENDPOINT
            value: "databricks-claude-sonnet-5-5"
          - name: PRREVIEW_SEVERITY_GATE
            value: "error"
          # Admin console access (/console). Comma-separated emails; not
          # editable from the console itself. Read-only users go in
          # PRREVIEW_CONSOLE_VIEWERS — add it when there are any (Apps
          # rejects an empty env value).
          - name: PRREVIEW_CONSOLE_ADMINS
            value: "k.phiri@decisioninc.com"
          # Where console settings are stored. `volume` reads them on every
          # review (30s cache); `none` turns the console's editing off.
          - name: PRREVIEW_SETTINGS_STORE
            value: "volume"
          - name: PRREVIEW_SETTINGS_VOLUME
            value: "/Volumes/main/${resources.schemas.pr_review.name}/console"
          # Models the console may switch to. Each needs a CAN_QUERY resource
          # below; the app cannot be granted access at runtime.
          - name: PRREVIEW_ALLOWED_MODELS
            value: "databricks-claude-sonnet-5-5,databricks-claude-opus-5-5,databricks-claude-sonnet-5,databricks-claude-haiku-4-5,databricks-gpt-oss-120b,databricks-llama-4-maverick"

      # Resources this app is allowed to use.
      resources:
        - name: 'ai_reviewer_experiment'
          experiment:
            # Filled in by `uv run quickstart`.
            experiment_id: "3094137377660895"
            permission: 'CAN_MANAGE'

        - name: 'review-model'
          serving_endpoint:
            # Must match PRREVIEW_MODEL_ENDPOINT above.
            name: 'databricks-claude-sonnet-5-5'
            permission: 'CAN_QUERY'

        - name: 'model-claude-opus-5-5'
          serving_endpoint:
            name: 'databricks-claude-opus-5-5'
            permission: 'CAN_QUERY'

        - name: 'model-claude-sonnet-5'
          serving_endpoint:
            name: 'databricks-claude-sonnet-5'
            permission: 'CAN_QUERY'

        - name: 'model-claude-haiku-4-5'
          serving_endpoint:
            name: 'databricks-claude-haiku-4-5'
            permission: 'CAN_QUERY'

        - name: 'model-gpt-oss-120b'
          serving_endpoint:
            name: 'databricks-gpt-oss-120b'
            permission: 'CAN_QUERY'

        - name: 'model-llama-4-maverick'
          serving_endpoint:
            name: 'databricks-llama-4-maverick'
            permission: 'CAN_QUERY'

        - name: 'console-settings'
          uc_securable:
            securable_type: 'VOLUME'
            securable_full_name: 'main.${resources.schemas.pr_review.name}.console'
            permission: 'WRITE_VOLUME'
      # Who may call the app. Declared here (not set by hand in the UI) so the
      # grants survive the app being deleted and recreated. This list replaces
      # the app's ACL on deploy, so the owner is listed explicitly.
      permissions:
        - level: CAN_MANAGE
          user_name: k.phiri@decisioninc.com
        # pr-review-github-ci: the service principal GitHub Actions uses to
        # get an OAuth token for pr-review.yml / pr-apply.yml.
        - level: CAN_USE
          service_principal_name: eaf382c6-9e28-4ddb-9754-472edc184a2b

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-4488695583162022.2.azuredatabricks.net

  prod:
    mode: production
    # workspace:
    #   host: https://<your-workspace>.azuredatabricks.net
    resources:
      apps:
        pr_review_agent:
          name: pr-review-agent
