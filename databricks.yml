bundle:
  name: pr_review_agent

resources:
  apps:
    pr_review_agent:
      name: "pr-review-agent"
      description: "AI pull request reviewer for Azure DevOps"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-server"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "ai_reviewer_experiment"
          - name: LOG_LEVEL
            value: "INFO"

          # Any field of app/defaults/config.yaml can be overridden here with
          # PRREVIEW_<FIELD>. A reviewed repo's .prreview/config.yaml still
          # wins over these.
          - name: PRREVIEW_SCM
            value: "github"
          - name: PRREVIEW_MODEL_ENDPOINT
            value: "databricks-claude-sonnet-5-5"
          - name: PRREVIEW_SEVERITY_GATE
            value: "error"
          # Admin console access (/console). Comma-separated emails; not
          # editable from the console itself.
          - name: PRREVIEW_CONSOLE_ADMINS
            value: "k.phiri@decisioninc.com"
          - name: PRREVIEW_CONSOLE_VIEWERS
            value: ""

      # Resources this app is allowed to use.
      resources:
        - name: 'ai_reviewer_experiment'
          experiment:
            # Filled in by `uv run quickstart`.
            experiment_id: "3094137377660895"
            permission: 'CAN_MANAGE'

        - name: 'review-model'
          serving_endpoint:
            # Must match PRREVIEW_MODEL_ENDPOINT above.
            name: 'databricks-claude-sonnet-5-5'
            permission: 'CAN_QUERY'
      # Who may call the app. Declared here (not set by hand in the UI) so the
      # grants survive the app being deleted and recreated. This list replaces
      # the app's ACL on deploy, so the owner is listed explicitly.
      permissions:
        - level: CAN_MANAGE
          user_name: k.phiri@decisioninc.com
        # pr-review-github-ci: the service principal GitHub Actions uses to
        # get an OAuth token for pr-review.yml / pr-apply.yml.
        - level: CAN_USE
          service_principal_name: eaf382c6-9e28-4ddb-9754-472edc184a2b

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-4488695583162022.2.azuredatabricks.net

  prod:
    mode: production
    # workspace:
    #   host: https://<your-workspace>.azuredatabricks.net
    resources:
      apps:
        pr_review_agent:
          name: pr-review-agent
