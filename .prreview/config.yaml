# Repo-level settings for the AI PR reviewer (see README "Configuration").
#
# Opt in to "/apply": the PR author can reply /apply on one of the bot's
# inline suggestions and the bot pushes the fix as a commit. For /apply this
# file is read from the PR's *target* branch, so this only takes effect for
# pull requests opened after it has merged to master. Pushing also needs the
# PR_REVIEW_APPLY_TOKEN repo secret (see .github/workflows/pr-apply.yml).
allow_apply_fixes: true
applier: llm

# Test fixtures are deliberately imperfect inputs. Reviewing them invites
# /apply all to "fix" them, which breaks the tests that rely on them (it did
# on #15: tests/fixtures/apply-all-pr/files/other.py).
exclude_paths: ["tests/fixtures/**"]
